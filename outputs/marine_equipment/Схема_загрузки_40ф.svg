<text x="70" y="960" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">— Всего в контейнере: 284 позиций, 2866 штук, 25.82 т из 26, 37.7 из 67.2 куб. м</text>
<text x="70" y="980" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">— Остается во Владивостоке 1.48 т</text>
<text x="70" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">— Ящик не выше 0,91 м, иначе второй ярус не встает под потолок</text>
<text x="70" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">— Доска: 45 штук по 4 м, 0.90 куб. м, 633 кг</text>
<text x="70" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">— Мест под ящики: 36 — 16 над клинкетами и 20 на свободном полу, везде по два яруса</text>
