<text x="96" y="906" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="normal">5. Ящики верхнего яруса, что полегче</text>
<rect x="70.0" y="919.5" width="16.0" height="14.0" fill="#E4A672" stroke="#1F3864" stroke-width="1.2"/>
<text x="96" y="930" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F3864" text-anchor="start" font-weight="normal">6. Фильтры сверху, 1.0 т, над углами ящиков</text>
<text x="70" y="960" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">— Всего в контейнере: 127 позиций, 952 штук, 13.54 т из 22, 19.5 из 33.0 куб. м</text>
<text x="70" y="980" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">— Во Владивостоке не остается ничего</text>
<text x="70" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">— Ящик не выше 0,91 м, иначе второй ярус не встает под потолок</text>
<text x="70" y="1020" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">— Доска: 24 штук по 4 м, 0.47 куб. м, 332 кг</text>
<text x="70" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">— Мест под ящики: 16 — 8 над клинкетами и 8 на свободном полу, везде по два яруса</text>
</g>
</svg>