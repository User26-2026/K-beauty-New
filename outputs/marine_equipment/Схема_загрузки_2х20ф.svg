<text x="70" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">— Мест под ящики: 16 — 4 над клинкетами и 12 на свободном полу, везде по два яруса</text>
